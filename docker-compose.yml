version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: movies-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: movies_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: estebanmm13/movies-api:latest
    container_name: movies-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # ✅ CORREGIDO: nombres de variables que coinciden con application.yml (${DB_URL}, ${DB_USER}, ${DB_PASS})
      DB_URL: jdbc:mysql://mysql:3306/movies_dev?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: 1234
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 60000
      JWT_SECRET: 2da08e8ee264a149413ce46abebbd566b4c8bbb019b37708ed9d77f8511ac7bf
      SWAGGER_URL: http://192.168.1.55:8085
    ports:
      - "8085:8085"

volumes:
  mysql-data: